name: colosys-server

services:
  # ---------------------------------------------------------------- MySQL --
  # Keyrock stores users, applications and tokens here.
  mysql-db:
    image: mysql:5.7
    platform: linux/amd64          # mysql:5.7 has no ARM build (Apple Silicon)
    container_name: mysql-colosys
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-db}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # -------------------------------------------------------------- Keyrock --
  # FIWARE Identity Manager. Web GUI + REST API on port 3005.
  keyrock:
    image: ${KEYROCK_IMAGE:-quay.io/fiware/idm}
    container_name: keyrock-colosys
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      # Admin GUI, reachable only from this machine (use an SSH tunnel on a remote server).
      # The API talks to Keyrock over the internal Docker network, so nothing else needs this port.
      - "127.0.0.1:3005:3005"
    environment:
      IDM_DB_HOST: mysql-db
      IDM_DB_USER: root
      IDM_DB_PASS: ${MYSQL_ROOT_PASSWORD:-change-me-db}
      IDM_HOST: ${IDM_HOST:-http://localhost:3005}
      IDM_PORT: "3005"
      IDM_HTTPS_ENABLED: "false"
      # The admin account is created ONCE, the first time the database is empty.
      IDM_ADMIN_USER: admin
      IDM_ADMIN_EMAIL: ${KEYROCK_ADMIN_EMAIL:-admin@example.com}
      IDM_ADMIN_PASS: ${KEYROCK_ADMIN_PASSWORD:-change-me-admin}

  # ------------------------------------------------------------------ API --
  # Your back-end: register / login / logout / me, backed by Keyrock.
  api:
    build: ./api
    container_name: colosys-api
    restart: unless-stopped
    depends_on:
      - keyrock
    ports:
      - "8000:8000"                # http://localhost:8000/docs
    extra_hosts:
      # Lets the API reach services on THIS machine (e.g. an SSH tunnel) as host.docker.internal
      # on Linux too; Docker Desktop (Windows/Mac) already provides the name.
      - "host.docker.internal:host-gateway"
    environment:
      KEYROCK_URL: http://keyrock:3005
      KEYROCK_ADMIN_EMAIL: ${KEYROCK_ADMIN_EMAIL:-admin@example.com}
      KEYROCK_ADMIN_PASSWORD: ${KEYROCK_ADMIN_PASSWORD:-change-me-admin}
      # Leave both empty: the API registers its own OAuth app in Keyrock on
      # first start and keeps the credentials in the api-data volume.
      KEYROCK_CLIENT_ID: ${KEYROCK_CLIENT_ID:-}
      KEYROCK_CLIENT_SECRET: ${KEYROCK_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}     # set to true behind HTTPS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      CREDENTIALS_FILE: /data/keyrock_app.json
      # ---- FIWARE: where it runs does not matter (this machine, an AWS server...) ----
      # The API reaches Orion / IoT Agent / STH-Comet through their PUBLISHED ports on FIWARE_HOST.
      #   AWS server      : FIWARE_HOST=<public DNS or IP of the server>
      #   same computer   : FIWARE_HOST=host.docker.internal   (Linux: the docker0 IP, e.g. 172.17.0.1)
      # Compose stops with a message if FIWARE_HOST or NOTIFY_URL is missing in .env.
      ORION_URL: ${ORION_URL:-http://${FIWARE_HOST:?Set FIWARE_HOST in .env (address of the FIWARE server)}:1026}
      IOTA_URL: ${IOTA_URL:-http://${FIWARE_HOST}:4041}
      STH_URL: ${STH_URL:-http://${FIWARE_HOST}:8666}
      # These two are resolved INSIDE the FIWARE server's own Docker network, so the defaults hold
      # when FIWARE runs the course's docker-compose.yml.
      IOTA_CBROKER: ${IOTA_CBROKER:-http://orion:1026}
      STH_NOTIFY_URL: ${STH_NOTIFY_URL:-http://fiware-sth-comet:8666/notify}
      IOTA_API_KEY: ${IOTA_API_KEY:-TEF}
      FIWARE_SERVICE: ${FIWARE_SERVICE:-smartlamp}
      FIWARE_SERVICEPATH: ${FIWARE_SERVICEPATH:-/}
      # Address a DEVICE (ESP32) uses to reach Mosquitto; returned by POST /api/lamps.
      # With FIWARE on AWS this is the AWS server, so even the Wokwi simulator can reach it.
      MQTT_HOST: ${MQTT_HOST:-${FIWARE_HOST}}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # The URL Orion (on the FIWARE server) calls to deliver each reading to this API.
      # It must be reachable FROM THE FIWARE SERVER, so a laptop behind NAT needs a VPN
      # (Tailscale) or a tunnel (ngrok): see DEPLOY-AWS.md. Leave NOTIFY_TOKEN empty to get a
      # random secret on each start.
      NOTIFY_URL: ${NOTIFY_URL:?Set NOTIFY_URL in .env (how the FIWARE server reaches this API, e.g. http://100.64.0.5:8000/internal/orion/notify)}
      NOTIFY_TOKEN: ${NOTIFY_TOKEN:-}
      # ---- Automation ----
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      AUTOMATION_RETRY_SECONDS: ${AUTOMATION_RETRY_SECONDS:-30}
      # ---- History (STH-Comet from the same FIWARE stack; its URLs are set above) ----
      STH_SERVICE: ${STH_SERVICE:-}            # empty = same as FIWARE_SERVICE
      STH_SERVICEPATH: ${STH_SERVICEPATH:-}    # empty = same as FIWARE_SERVICEPATH
    volumes:
      - api-data:/data

volumes:
  mysql-data:
  api-data: